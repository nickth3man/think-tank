[package]
name = "think-tank"
version = "0.1.0"
edition = "2021"
description = "Multi-agent deliberation system: structured debate and convergence"

[lib]
name = "think_tank"
path = "src/lib.rs"

[[bin]]
name = "think-tank"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json", "tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
